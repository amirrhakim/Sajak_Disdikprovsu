<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
