    <text x="630" y="148" font-size="8" font-weight="bold">NO. BILLING</text>
    <text x="710" y="148" font-size="8" font-weight="bold">NTPN</text>

    <rect x="85" y="155" width="700" height="20" fill="#ffffff" stroke="#64748b" stroke-width="0.5" />
    <text x="98" y="168" font-size="8">1</text>
    <text x="115" y="168" font-size="8">10/02/2026</text>
    <text x="175" y="168" font-size="8">Belanja ATK Kantor</text>
    <text x="290" y="168" font-size="8">CV. SUMATERA UTARA MANDIRI</text>
    <text x="390" y="168" font-size="8">PPN Dalam Negeri</text>
    <text x="470" y="168" font-size="8">11.100.000</text>
    <text x="550" y="168" font-size="8" font-weight="bold">1.100.000</text>
    <text x="630" y="168" font-size="8">012345678901234</text>
    <text x="710" y="168" font-size="8">12AB34CD56EF78GH</text>

    <!-- Table Totals -->
    <rect x="85" y="175" width="700" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.5" />
    <text x="390" y="188" font-size="8" font-weight="bold">TOTAL JUMLAH BULAN INI:</text>
    <text x="470" y="188" font-size="8" font-weight="bold">11.100.000</text>
    <text x="550" y="188" font-size="8" font-weight="bold">1.100.000</text>

    <!-- 2 Signatures Block -->
    <text x="180" y="240" font-size="8" text-anchor="middle">Mengetahui,</text>
    <text x="180" y="252" font-size="8" font-weight="bold" text-anchor="middle">Kepala SMA Negeri 1 Medan</text>
    <text x="180" y="305" font-size="8" font-weight="bold" text-anchor="middle"><u>Drs. H. Mhd. Syahrul, M.Pd</u></text>
    <text x="180" y="316" font-size="8" text-anchor="middle">NIK. 1271012304680002</text>

    <text x="620" y="240" font-size="8" text-anchor="middle">Medan, 28 Februari 2026</text>
    <text x="620" y="252" font-size="8" font-weight="bold" text-anchor="middle">Bendahara Sekolah</text>
    <text x="620" y="305" font-size="8" font-weight="bold" text-anchor="middle"><u>Hj. Nuraini Siregar, S.E</u></text>
    <text x="620" y="316" font-size="8" text-anchor="middle">NIK. 1271055508820004</text>
