    <text x="435" y="70" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">BUKU PEMBANTU PAJAK (BPP)</text>
    <text x="435" y="84" font-size="10" fill="#475569" text-anchor="middle">PERIODE: BULAN FEBRUARI 2026</text>
    <line x1="85" y1="92" x2="785" y2="92" stroke="#0f172a" stroke-width="2" />

    <!-- Metadata Sub Unit Coretax -->
    <text x="85" y="110" font-size="9" fill="#334155">Sub Unit Kerja: <strong>SMA NEGERI 1 MEDAN</strong></text>
    <text x="85" y="123" font-size="9" fill="#334155">NPSN / NITKU: <strong>10204567 / 0012345678901000000000</strong></text>
    <text x="500" y="110" font-size="9" fill="#334155">Cabang Dinas: <strong>Cabang Dinas Wilayah I</strong></text>
    <text x="500" y="123" font-size="9" fill="#334155">Kab / Kota: <strong>Kota Medan</strong></text>

    <!-- Table 13 Columns Preview -->
    <rect x="85" y="135" width="700" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="0.5" />
    <text x="95" y="148" font-size="8" font-weight="bold">NO</text>
    <text x="120" y="148" font-size="8" font-weight="bold">TGL BPP</text>
    <text x="175" y="148" font-size="8" font-weight="bold">URAIAN KEGIATAN</text>
    <text x="290" y="148" font-size="8" font-weight="bold">REKANAN</text>
    <text x="390" y="148" font-size="8" font-weight="bold">JENIS PAJAK</text>
    <text x="470" y="148" font-size="8" font-weight="bold">BELANJA (RP)</text>
