<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="auto" style="background:#f1f5f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- Browser Frame -->
  <rect x="15" y="15" width="870" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <!-- Window Controls -->
  <rect x="15" y="15" width="870" height="42" rx="14" fill="#f8fafc" />
  <circle cx="38" cy="36" r="5" fill="#ef4444" />
  <circle cx="54" cy="36" r="5" fill="#f59e0b" />
  <circle cx="70" cy="36" r="5" fill="#10b981" />
  <rect x="95" y="26" width="630" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="110" y="41" font-size="11" fill="#64748b">https://sajak.disdik.sumutprov.go.id/portal</text>
  <rect x="760" y="26" width="110" height="22" rx="6" fill="#1a2b6b" />
  <text x="815" y="41" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SAJAK PROVSU</text>
  
  <!-- Content Body / Ambient Background -->
  <g transform="translate(15, 57)">
    <rect x="0" y="0" width="870" height="468" fill="#f8fafc" />
    <circle cx="150" cy="100" r="140" fill="#dbeafe" opacity="0.3" />
    <circle cx="720" cy="380" r="160" fill="#a7f3d0" opacity="0.25" />
    
    <!-- Login Card (Format Disdik Provsu / SIDILAGA) -->
    <rect x="225" y="40" width="420" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Brand Header -->
    <!-- Left Logo (Pemprovsu) -->
    <rect x="245" y="58" width="46" height="52" rx="6" fill="#f8fafc" />
    <text x="268" y="90" font-size="28" text-anchor="middle">🏛️</text>
    
    <!-- Center Brand: SAJAK & Subtitle -->
    <text x="435" y="85" font-size="26" font-weight="900" fill="#1a2b6b" letter-spacing="2" text-anchor="middle">SAJAK</text>
    <text x="435" y="103" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Sistem Rekapitulasi Pajak</text>
    
    <!-- Right Logo (Disdik Provsu) -->
    <rect x="579" y="58" width="46" height="52" rx="6" fill="#eff6ff" />
    <text x="602" y="83" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Disdik</text>
    <text x="602" y="96" font-size="6.5" font-weight="bold" fill="#1e293b" text-anchor="middle">PROVSU</text>
    
    <!-- Divider -->
    <line x1="245" y1="122" x2="625" y2="122" stroke="#f1f5f9" stroke-width="1.5" />
    
    <!-- Welcome Badge -->
    <rect x="285" y="132" width="300" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="435" y="147" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">Portal Satuan Pendidikan &amp; Unit Kerja Dinas</text>
    
    <!-- Input Username -->
    <text x="255" y="180" font-size="10.5" font-weight="bold" fill="#334155">USERNAME / NPSN / KODE UNIT</text>
    <rect x="255" y="188" width="360" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="270" y="211" font-size="12" fill="#0f172a">10204567</text>
    <rect x="545" y="196" width="60" height="20" rx="4" fill="#ecfdf5" />
    <text x="575" y="210" font-size="9.5" font-weight="bold" fill="#047857" text-anchor="middle">8 Digit ✓</text>
    
    <!-- Input Password -->
    <text x="255" y="246" font-size="10.5" font-weight="bold" fill="#334155">PASSWORD / KATA SANDI</text>
    <rect x="255" y="254" width="360" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="270" y="278" font-size="14" fill="#0f172a">••••••••••••</text>
    <text x="595" y="277" font-size="13" fill="#94a3b8">👁️</text>
    
    <!-- Login Button (Option 1: Harmonized Emerald Green #047857) -->
    <rect x="255" y="306" width="360" height="40" rx="10" fill="#047857" />
    <text x="435" y="331" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Masuk ke Sistem →</text>
    
    <!-- Footer Help -->
    <line x1="255" y1="365" x2="615" y2="365" stroke="#f1f5f9" stroke-width="1" />
    <text x="435" y="385" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Pemerintah Provinsi Sumatera Utara • Dinas Pendidikan</text>
    <text x="435" y="401" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Tahun Anggaran 2026 • Terintegrasi Coretax Sub Unit DJP</text>
  </g>
</svg>
