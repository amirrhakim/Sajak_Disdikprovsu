    <rect x="750" y="12" width="95" height="26" rx="6" fill="#f1f5f9" />
    <text x="797" y="29" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">10204567 ▾</text>

    <!-- Header Banner -->
