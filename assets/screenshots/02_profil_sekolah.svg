    <text x="45" y="393" font-size="12" font-weight="bold" fill="#0f172a">1271012304680002</text>

    <rect x="445" y="275" width="400" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="445" y="275" width="400" height="30" rx="8" fill="#f8fafc" />
    <text x="465" y="295" font-size="11" font-weight="bold" fill="#047857">BENDAHARA SEKOLAH (PEJABAT 2)</text>
    <text x="465" y="330" font-size="11" fill="#64748b">Nama Lengkap:</text>
    <text x="465" y="348" font-size="12" font-weight="bold" fill="#0f172a">Hj. Nuraini Siregar, S.E</text>
    <text x="465" y="375" font-size="11" fill="#64748b">NIK (16 Digit):</text>
    <text x="465" y="393" font-size="12" font-weight="bold" fill="#0f172a">1271055508820004</text>
