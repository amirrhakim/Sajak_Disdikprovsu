<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Browser Frame -->
  <rect x="15" y="15" width="870" height="490" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
  <!-- Window Controls -->
  <rect x="15" y="15" width="870" height="40" rx="12" fill="#f1f5f9" />
  <circle cx="35" cy="35" r="5" fill="#ef4444" />
  <circle cx="50" cy="35" r="5" fill="#f59e0b" />
  <circle cx="65" cy="35" r="5" fill="#10b981" />
  <rect x="90" y="25" width="650" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="105" y="39" font-size="11" fill="#64748b">https://sajak.disdik.sumutprov.go.id/portal</text>
  <rect x="780" y="25" width="85" height="20" rx="6" fill="#047857" />
  <text x="822" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SAJAK PROV</text>
  
  <!-- Content Body -->
  <g transform="translate(15, 55)">
    <!-- Bagian C: Kalkulator -->
    <rect x="25" y="10" width="820" height="150" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <rect x="25" y="10" width="820" height="28" rx="8" fill="#ecfdf5" />
    <text x="40" y="29" font-size="11" font-weight="bold" fill="#047857">BAGIAN C: PERHITUNGAN PAJAK (IDE 1 - KALKULATOR OTOMATIS)</text>

    <text x="40" y="58" font-size="10" font-weight="bold" fill="#334155">NILAI BELANJA BRUTO (RP) *</text>
    <rect x="40" y="65" width="250" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="86" font-size="12" font-weight="bold" fill="#0f172a">Rp 11.100.000</text>

    <text x="310" y="58" font-size="10" font-weight="bold" fill="#334155">JENIS PAJAK BPP (KOLOM 13)</text>
    <rect x="310" y="65" width="220" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="320" y="86" font-size="11" font-weight="bold" fill="#0f172a">PPN</text>

    <text x="550" y="58" font-size="10" font-weight="bold" fill="#334155">NILAI PAJAK SETOR (RP) *</text>
    <rect x="550" y="65" width="270" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="560" y="86" font-size="13" font-weight="bold" fill="#047857">Rp 1.100.000</text>

    <!-- Tombol Hitung Otomatis -->
    <rect x="550" y="105" width="270" height="26" rx="6" fill="#047857" />
    <text x="685" y="122" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Hitung Pajak Otomatis (11/111)</text>

    <!-- Badge Info Kalkulasi -->
    <rect x="40" y="105" width="490" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="50" y="122" font-size="10" font-weight="bold" fill="#15803d">✓ Dihitung Otomatis: DPP Rp 10.000.000 | Tarif PPN 11% = Rp 1.100.000</text>

    <!-- Bagian D: Penyetoran -->
    <rect x="25" y="170" width="820" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="25" y="170" width="820" height="26" rx="8" fill="#f8fafc" />
    <text x="40" y="188" font-size="11" font-weight="bold" fill="#334155">BAGIAN D: KODE BILLING &amp; BUKTI SETOR (NTPN)</text>

    <text x="40" y="215" font-size="10" fill="#64748b">TGL BILLING</text>
    <rect x="40" y="222" width="130" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="240" font-size="10" fill="#0f172a">2026-02-10</text>

    <text x="190" y="215" font-size="10" font-weight="bold" fill="#334155">NO. BILLING (15 DIGIT) *</text>
    <rect x="190" y="222" width="200" height="28" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
    <text x="200" y="240" font-size="11" font-weight="bold" fill="#0f172a">012345678901234</text>

    <text x="410" y="215" font-size="10" fill="#64748b">NTPN (16 KARAKTER)</text>
    <rect x="410" y="222" width="220" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="420" y="240" font-size="11" font-weight="bold" fill="#047857">12AB34CD56EF78GH</text>

    <text x="650" y="215" font-size="10" fill="#64748b">TGL SETOR</text>
    <rect x="650" y="222" width="170" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="660" y="240" font-size="10" fill="#0f172a">2026-02-12</text>

    <!-- Bagian E: Link Bukti Dokumen (Ide 4) -->
    <rect x="25" y="275" width="820" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="25" y="275" width="820" height="26" rx="8" fill="#f8fafc" />
    <text x="40" y="293" font-size="11" font-weight="bold" fill="#334155">BAGIAN E: SUMBER DANA &amp; TAUTAN BUKTI (IDE 4 - KOLOM 25)</text>

    <text x="40" y="320" font-size="10" fill="#64748b">SUMBER DANA</text>
    <rect x="40" y="327" width="200" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="50" y="345" font-size="10" fill="#0f172a">BOSP Reguler</text>

    <text x="260" y="320" font-size="10" font-weight="bold" fill="#047857">LINK BUKTI DOKUMEN (GOOGLE DRIVE / PDF URL) 🔗</text>
    <rect x="260" y="327" width="560" height="28" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <text x="270" y="345" font-size="10" fill="#2563eb">https://drive.google.com/file/d/1A2b3C4d5E6F7G8H.../view?usp=sharing</text>

    <!-- Submit Button -->
    <rect x="25" y="380" width="820" height="40" rx="8" fill="#047857" />
    <text x="435" y="405" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">💾 Simpan Transaksi Pajak (Input Selesai) →</text>
  </g>
</svg>