    /** Memformat angka menjadi string pemisah ribuan gaya Indonesia (titik) */
    function formatRibuan(angka) {
        var n = Number(angka || 0);
        if (isNaN(n)) return '0';
        return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    /** Mengamankan string sebelum disisipkan ke innerHTML untuk mencegah XSS */
    function escapeHtml(str) {
        return String(str === null || str === undefined ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    /**
     * Wrapper aman pemanggilan Google Apps Script agar pratinjau lokal / Gemini Canvas
     * tidak memicu ReferenceError ketika objek `google` tidak tersedia.
     */
    function callGasServer_(methodName, args, onSuccess, onFailure) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            try {
                var runner = google.script.run
                    .withSuccessHandler(function (res) {
                        if (typeof onSuccess === 'function') onSuccess(res);
                    })
                    .withFailureHandler(function (err) {
                        if (typeof onFailure === 'function') {
                            onFailure(err);
                        } else {
                            showToast('Gagal terhubung ke server: ' + (err && err.message ? err.message : String(err)), 'error');
                        }
                    });
                if (typeof runner[methodName] !== 'function') {
                    var nfErr = new Error('Fungsi server "' + methodName + '" tidak ditemukan.');
                    if (typeof onFailure === 'function') onFailure(nfErr);
                    else showToast(nfErr.message, 'error');
                    return;
                }
                runner[methodName].apply(runner, args || []);
            } catch (ex) {
                if (typeof onFailure === 'function') onFailure(ex);
                else showToast('Terjadi kesalahan pemanggilan server: ' + ex.message, 'error');
            }
        } else {
            var previewErr = new Error('Mode Pratinjau Offline: Jalankan melalui Web App Google Apps Script untuk terhubung ke database.');
            if (typeof onFailure === 'function') {
                onFailure(previewErr);
            } else {
                showToast(previewErr.message, 'warning');
            }
        }
    }

    /* ===================== TOAST & DIALOG HTML KUSTOM ===================== */

    /**
     * Menampilkan notifikasi toast kustom (pengganti alert bawaan browser)
     * type: 'success' | 'error' | 'warning' | 'info'
     */
    function showToast(message, type) {
        var container = $('toastContainer');
        if (!container) return;

        var palette = {
            success: { bg: 'bg-emerald-800 border-emerald-600 text-white', icon: '✅' },
            error: { bg: 'bg-rose-700 border-rose-500 text-white', icon: '❌' },
            warning: { bg: 'bg-amber-600 border-amber-400 text-white', icon: '⚠️' },
            info: { bg: 'bg-slate-800 border-slate-600 text-white', icon: 'ℹ️' }
        };
        var cfg = palette[type] || palette.info;

        var toast = document.createElement('div');
        toast.className = 'pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs font-medium leading-relaxed transition-all duration-300 ' + cfg.bg;
        toast.innerHTML =
            '<span class="text-sm shrink-0 leading-none mt-0.5">' + cfg.icon + '</span>' +
            '<div class="flex-1 whitespace-pre-line break-words">' + escapeHtml(message) + '</div>' +
            '<button type="button" class="text-white/70 hover:text-white font-bold text-sm leading-none ml-1 cursor-pointer">&times;</button>';

        var closeBtn = toast.querySelector('button');
        var removeToast = function () {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-6px)';
            setTimeout(function () {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 250);
        };
        if (closeBtn) closeBtn.addEventListener('click', removeToast);

        container.appendChild(toast);
        setTimeout(removeToast, type === 'error' ? 6000 : 4200);
    }

    /** Modal konfirmasi HTML kustom (pengganti window.confirm) */
    function openCustomConfirm(title, message, onConfirm, isDanger) {
        var modal = $('modalCustomDialog');
        if (!modal) return;

        $('customDialogTitle').textContent = title || 'Konfirmasi Tindakan';
        $('customDialogMessage').textContent = message || '';
        $('customDialogInputWrap').classList.add('hidden');
        $('customDialogIcon').textContent = isDanger ? '🗑️' : '❓';
        $('customDialogIcon').className = 'w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 ' +
            (isDanger ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700');

        var btnOk = $('customDialogConfirmBtn');
        var btnCancel = $('customDialogCancelBtn');
        btnOk.textContent = isDanger ? 'Ya, Lanjutkan' : 'Ya, Proses';
        btnOk.className = 'px-5 py-2 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer ' +
            (isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-700 hover:bg-emerald-800');

        var cleanup = function () {
            modal.classList.add('hidden');
            btnOk.onclick = null;
            btnCancel.onclick = null;
        };

        btnCancel.onclick = cleanup;
        btnOk.onclick = function () {
            cleanup();
            if (typeof onConfirm === 'function') onConfirm();
        };

        modal.classList.remove('hidden');
    }

    /** Modal input teks HTML kustom (pengganti window.prompt) */
    function openCustomPrompt(title, message, defaultValue, onSubmit, inputType, placeholder) {
        var modal = $('modalCustomDialog');
        if (!modal) return;

        $('customDialogTitle').textContent = title || 'Masukkan Data';
        $('customDialogMessage').textContent = message || '';
        $('customDialogIcon').textContent = '✏️';
        $('customDialogIcon').className = 'w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg shrink-0';

        var wrap = $('customDialogInputWrap');
        var input = $('customDialogInput');
        wrap.classList.remove('hidden');
        input.type = inputType || 'text';
        input.value = defaultValue || '';
        input.placeholder = placeholder || '';

        var btnOk = $('customDialogConfirmBtn');
        var btnCancel = $('customDialogCancelBtn');
        btnOk.textContent = 'Simpan';
        btnOk.className = 'px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer';

        var cleanup = function () {
            modal.classList.add('hidden');
            btnOk.onclick = null;
            btnCancel.onclick = null;
            input.onkeydown = null;
        };

        var submitAction = function () {
            var val = String(input.value || '');
            cleanup();
            if (typeof onSubmit === 'function') onSubmit(val);
        };

        btnCancel.onclick = cleanup;
        btnOk.onclick = submitAction;
        input.onkeydown = function (ev) {
            if (ev.key === 'Enter') {
                ev.preventDefault();
                submitAction();
            }
        };

        modal.classList.remove('hidden');
        setTimeout(function () { input.focus(); input.select(); }, 60);
    }

    /** Mendeteksi akun Cabang Dinas termasuk variasi pemisah strip, spasi, dan garis bawah */
    function isCabdisAccount() {
        if (!sessionData || !sessionData.operator) return false;
        if (sessionData.operator.isCabdis === true) return true;
        var n = String(sessionData.operator.npsn || '').trim();
        var u = String(sessionData.operator.username || '').trim();
        var nm = String(sessionData.operator.namaOperator || '').trim();
        return /^(?:CABDIS|CABDIN)[-\s_]*\d+$/i.test(n) ||
            /^(?:CABDIS|CABDIN)[-\s_]*\d+$/i.test(u) ||
            /CABANG\s+DINAS/i.test(nm);
    }

    function isUnit() {
        return !!sessionData && (sessionData.role === 'UNIT_DINAS' || isCabdisAccount());
    }

    function isFieldRole() {
        return !!sessionData && (sessionData.role === 'OPERATOR' || sessionData.role === 'UNIT_DINAS');
    }

    function setSelectValue(id, val) {
        var el = $(id);
        if (!el) return;
        var target = String(val || '').trim();
        if (el.tagName !== 'SELECT') {
            el.value = target;
            return;
        }
        for (var i = 0; i < el.options.length; i++) {
            if (el.options[i].value === target) {
                el.selectedIndex = i;
                return;
            }
        }
        if (target !== '') {
            var newOpt = document.createElement('option');
            newOpt.value = target;
            newOpt.textContent = target;
            el.appendChild(newOpt);
            el.value = target;
        } else {
            el.selectedIndex = 0;
        }
    }

    function fillDropdown(elementId, items, placeholderText) {
        var el = $(elementId);
        if (!el) return;
        el.innerHTML = '<option value="">' + escapeHtml(placeholderText) + '</option>';
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
            var opt = document.createElement('option');
            opt.value = items[i];
            opt.textContent = items[i];
            el.appendChild(opt);
        }
    }

    var DIGIT_RULES = {
        pf_npsn: { label: 'NPSN', min: 8, max: 8, type: 'digits', noBadge: true },
        pf_subUnitCoretax: { label: 'No. Sub Unit Coretax', min: 16, max: 22, type: 'digits' },

    function sanitizeByRule(value, rule) {
        var v = String(value || '');
        v = rule.type === 'alnum' ? v.toUpperCase().replace(/[^A-Z0-9]/g, '') : v.replace(/[^0-9]/g, '');
        return v.slice(0, rule.max);
    }

    function updateDigitBadge(id) {
        if (id === 'p_noBilling' && $('p_jalurBelanja') && $('p_jalurBelanja').value === 'SIPLAH') {
            var b = $('p_noBilling_badge');
            if (b) b.style.display = 'none';
            return;
        }
        var rule = DIGIT_RULES[id], el = $(id);
        if (!rule || !el) return;
        var clean = sanitizeByRule(el.value, rule);
        if (clean !== el.value) el.value = clean;
        var badge = $(id + '_badge');
        if (!badge) return;
        var len = clean.length;
        var target = rule.min === rule.max ? String(rule.max) : rule.min + '–' + rule.max;
        var ok = len >= rule.min && len <= rule.max;
        badge.textContent = len + ' / ' + target + (rule.type === 'alnum' ? ' karakter' : ' digit') + (rule.optional && len === 0 ? ' (opsional)' : '');
        badge.className = 'digit-badge' + (ok ? ' ok' : (len === 0 ? '' : ' bad'));
    }

    function initDigitCounters() {
        Object.keys(DIGIT_RULES).forEach(function (id) {
            var el = $(id), rule = DIGIT_RULES[id];
            if (!el || el.dataset.digitInit) return;
            el.dataset.digitInit = '1';
            el.setAttribute('maxlength', rule.max);
            el.setAttribute('inputmode', rule.type === 'digits' ? 'numeric' : 'text');
            if (!rule.noBadge) {
                var badge = document.createElement('div');
                badge.id = id + '_badge';
                el.insertAdjacentElement('afterend', badge);
            }
            el.addEventListener('input', function () { updateDigitBadge(id); });
            updateDigitBadge(id);
        });
    }

    function refreshDigitBadges(prefix) {
        Object.keys(DIGIT_RULES).forEach(function (id) {
            if (id.indexOf(prefix) === 0) updateDigitBadge(id);
        });
    }

    function validateDigitFields(ids) {
        for (var i = 0; i < ids.length; i++) {
            var rule = DIGIT_RULES[ids[i]], el = $(ids[i]);
            if (!rule || !el) continue;
            var v = sanitizeByRule(el.value, rule);
            if (!v && rule.optional) continue;
            if (v.length < rule.min || v.length > rule.max) {
                var need = rule.min === rule.max ? 'tepat ' + rule.max : rule.min + ' sampai ' + rule.max;
                return rule.label + ' harus ' + need + (rule.type === 'alnum' ? ' karakter alfanumerik (A-Z, 0-9).' : ' digit angka.') + ' Saat ini ' + v.length + '.';
            }
        }
        return '';
    }

    /* ===================== PEMBANGUN FORMULIR & VIEW PROFIL ===================== */

    var INPUT_CLS = 'w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm';

    function fld(id, label, o) {
        o = o || {};
        var req = o.req !== false;
        var wrapId = o.wrapId ? ' id="' + o.wrapId + '"' : '';
        var h = '<div' + wrapId + ' class="' + (o.span ? 'sm:col-span-2' : '') + '"><label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">' + label + (req ? ' *' : '') + '</label>';
        if (o.type === 'select') {
            h += '<select id="' + id + '"' + (req ? ' required' : '') + ' class="' + INPUT_CLS + ' bg-white"></select>';
        } else if (o.type === 'textarea') {
            h += '<textarea id="' + id + '" rows="2"' + (req ? ' required' : '') + ' class="' + INPUT_CLS + '"></textarea>';
        } else {
            h += '<input type="text" id="' + id + '"' + (req ? ' required' : '') + (o.readonly ? ' readonly' : '') + (o.list ? ' list="' + o.list + '"' : '') + (o.ph ? ' placeholder="' + o.ph + '"' : '') + ' class="' + INPUT_CLS + (o.readonly ? ' bg-slate-100 text-slate-700 font-semibold' : '') + '">';
        }
        return h + '</div>';
    }

        $('profilDinasFields').innerHTML =

            fld('pd_namaSekolah', 'Nama Unit Kerja') +
            fld('pd_subUnitCoretax', 'No. Sub Unit Coretax / NITKU (16–22 digit)', { span: true }) +
            fld('pd_wilayahBinaan', 'Wilayah Binaan Cabang Dinas', { wrapId: 'wrapPdWilayahBinaan', span: true, req: false, list: 'datalistWilayahBinaan', ph: 'Otomatis sesuai Wilayah Binaan Cabang Dinas' }) +
            fld('pd_alamatSekolah', 'Alamat Unit Kerja', { type: 'textarea', span: true }) +

            fld('pd_ket', 'Keterangan (Ket)', { req: false, ph: 'Opsional' }) +
            '</div></div>' +
            officialBlock('KPA (Kuasa Pengguna Anggaran)', 'Kpa') +
            officialBlock('PPTK (Pejabat Pelaksana Teknis Kegiatan)', 'Pptk') +
            officialBlock('BPP (Bendahara Pengeluaran Pembantu)', 'Bpp');

        fillDropdown('pf_tipeSekolah', ['SMA', 'SMK', 'SLB'], '-- Pilih Tipe Sekolah --');
        $('pf_namaSekolah').addEventListener('input', function () { handleAutoWilayahSekolah(this.value); });
        initDigitCounters();
    }

    function fillProfileForm(prefix, keys, p) {
        keys.forEach(function (k) {
            var el = $(prefix + k);
            if (!el) return;
            var val = p && p[k] !== undefined ? p[k] : '';
            if (el.tagName === 'SELECT') setSelectValue(prefix + k, val);
            else el.value = val;
        });
        refreshDigitBadges(prefix);
    }

    function collectProfileForm(prefix, keys) {
        var out = {};
        keys.forEach(function (k) {
            var el = $(prefix + k);
            out[k] = el ? String(el.value || '').trim() : '';
        });
        return out;
    }

    function handleAutoWilayahSekolah(val) {
        var key = String(val || '').trim().toUpperCase();
        var match = schoolMap[key];
        if (!match) return;
        if (match.kabKota) setSelectValue('pf_kabKota', match.kabKota);
        if (match.cabdin) setSelectValue('pf_cabangDinas', match.cabdin);
        if (match.tipe && ['SMA', 'SMK', 'SLB'].indexOf(match.tipe.toUpperCase()) !== -1) {
            setSelectValue('pf_tipeSekolah', match.tipe.toUpperCase());
        }
        if (match.nitku && !$('pf_subUnitCoretax').value) $('pf_subUnitCoretax').value = match.nitku;
        if (match.alamat && !$('pf_alamatSekolah').value) $('pf_alamatSekolah').value = match.alamat;
        if (match.kelurahan && !$('pf_kelurahan').value) $('pf_kelurahan').value = match.kelurahan;
        if (match.kecamatan && !$('pf_kecamatan').value) $('pf_kecamatan').value = match.kecamatan;
        refreshDigitBadges('pf_');
    }

    function kv(label, value) {
        return '<div><dt class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">' + label + '</dt><dd class="text-sm font-semibold text-slate-800 mt-0.5 break-words">' + escapeHtml(value || '-') + '</dd></div>';
    }

    function card(title, inner, wide) {
        return '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5' + (wide ? ' lg:col-span-2' : '') + '"><h3 class="text-sm font-bold text-emerald-800 mb-3 pb-2 border-b border-slate-100">' + title + '</h3><dl class="grid grid-cols-1 sm:grid-cols-2 gap-3">' + inner + '</dl></div>';
    }

    function renderProfileView(p) {
        var html;
        if (isUnit()) {
            var isCab = isCabdisAccount();
            var alamatDinas = [p.alamatSekolah, p.provinsi].filter(function (x) { return x; }).join(', ');
            $('profileViewTitle').textContent = 'Profil Unit Kerja Dinas';
            var unitMeta =
                kv('Kode Unit', p.npsn) +
                kv('Nama Unit Kerja', p.namaSekolah) +
                kv('No. Sub Unit Coretax', p.subUnitCoretax) +
                (isCab ? kv('Wilayah Binaan', p.wilayahBinaan || p.kabKota) : '') +
                kv('Provinsi', p.provinsi || 'Sumatera Utara') +
                kv('Keterangan', p.ket) +
                '<div class="sm:col-span-2">' + kv('Alamat Unit Kerja', alamatDinas) + '</div>';

            html = card('Identitas Unit Kerja', unitMeta, true) +
                card('KPA — Kuasa Pengguna Anggaran', kv('Nama', p.namaKpa) + kv('NIP', p.nipKpa) + kv('NIK', p.nikKpa) + kv('Pangkat / Gol', p.pangkatKpa) + kv('Jabatan', p.jabatanKpa)) +
                card('PPTK — Pejabat Pelaksana Teknis Kegiatan', kv('Nama', p.namaPptk) + kv('NIP', p.nipPptk) + kv('NIK', p.nikPptk) + kv('Pangkat / Gol', p.pangkatPptk) + kv('Jabatan', p.jabatanPptk)) +
                card('BPP — Bendahara Pengeluaran Pembantu', kv('Nama', p.namaBpp) + kv('NIP', p.nipBpp) + kv('NIK', p.nikBpp) + kv('Pangkat / Gol', p.pangkatBpp) + kv('Jabatan', p.jabatanBpp));
        } else {
            var alamatSek = [p.alamatSekolah, p.kelurahan, p.kecamatan, p.kabKota, p.provinsi].filter(function (x) { return x; }).join(', ');
            $('profileViewTitle').textContent = 'Profil Satuan Pendidikan';
            html = card('Identitas Sekolah',
                kv('NPSN', p.npsn) + kv('Nama Sekolah', p.namaSekolah) + kv('Tipe Sekolah', p.tipeSekolah) + kv('No. Sub Unit Coretax', p.subUnitCoretax) +
                kv('Kabupaten / Kota', p.kabKota) + kv('Cabang Dinas', p.cabangDinas) + kv('Keterangan', p.ket) +
                '<div class="sm:col-span-2">' + kv('Alamat', alamatSek) + '</div>', true) +
                card('Kepala Sekolah', kv('Nama', p.namaKasek) + kv('NIK', p.nikKasek)) +
                card('Bendahara Sekolah', kv('Nama', p.namaBendahara) + kv('NIK', p.nikBendahara));
        }
        $('profileViewContent').innerHTML = html;
    }

    function showProfile(edit) {
        if (!sessionData || !isFieldRole()) return;
        var p = sessionData.operator.profil;
        var prefill = sessionData.operator.prefill || {};
        if (!edit && p) {
            renderProfileView(p);
            $('profileEditBox').classList.add('hidden');
            $('profileViewBox').classList.remove('hidden');
            return;
        }
        var unit = isUnit();
        var cab = isCabdisAccount();
        $('profileViewBox').classList.add('hidden');
        $('profileEditBox').classList.remove('hidden');
        $('profilForm').classList.toggle('hidden', unit);
        $('profilDinasForm').classList.toggle('hidden', !unit);

        if (unit && $('wrapPdWilayahBinaan')) {
            $('wrapPdWilayahBinaan').classList.toggle('hidden', !cab);
            $('pd_wilayahBinaan').required = cab;
        }

        $('profileEditTitle').textContent = unit ? 'Edit Profil Unit Kerja Dinas' : 'Edit Profil Satuan Pendidikan';
        $('profileEditHint').textContent = unit
            ? 'No. Sub Unit Coretax otomatis diisi dari SUB UNIT BIDANG-CABDIS. Lengkapi data pejabat KPA, PPTK, dan BPP.'
            : 'Nama Sekolah, NITKU Coretax 22 digit, Alamat, & Wilayah otomatis disinkronkan dari Data NPSN & SUB UNIT SEKOLAH.';
        var cancels = document.getElementsByClassName('btnCancelProfil');
        for (var i = 0; i < cancels.length; i++) cancels[i].classList.toggle('hidden', !p);

        var base = {};
        var targetKeys = unit ? DINAS_KEYS : SCHOOL_KEYS;
        for (var k = 0; k < targetKeys.length; k++) {
            var keyName = targetKeys[k];
            base[keyName] = (p && p[keyName]) ? p[keyName] : (prefill[keyName] || '');
        }
        if (unit && cab && !base.wilayahBinaan && p && p.kabKota) {
            base.wilayahBinaan = p.kabKota;
        }
        if (!base.npsn) base.npsn = sessionData.operator.npsn;
        if (!base.provinsi) base.provinsi = 'Sumatera Utara';

        if (unit) fillProfileForm('pd_', DINAS_KEYS, base);
        else fillProfileForm('pf_', SCHOOL_KEYS, base);
    }

    function setSessionProfil(p) {
        sessionData.operator.profil = p;
        sessionData.operator.hasProfil = true;
        $('topbarSchoolName').textContent = p.namaSekolah + ' (' + (isUnit() ? 'Kode: ' : 'NPSN: ') + p.npsn + ')';
        $('p_npsn').value = p.npsn || '';
        $('p_namaSekolah').value = p.namaSekolah || '';
        $('p_subUnitCoretax').value = p.subUnitCoretax || '';
        $('p_kabKota').value = isUnit() ? (isCabdisAccount() ? (p.wilayahBinaan || p.kabKota || '') : '') : (p.kabKota || '');
        $('p_cabangDinas').value = p.cabangDinas || '';
    }

    function submitProfil(e, unit) {
        if (e && e.preventDefault) e.preventDefault();
        var prefix = unit ? 'pd_' : 'pf_';
        var ids = Object.keys(DIGIT_RULES).filter(function (id) { return id.indexOf(prefix) === 0; });
        var digitErr = validateDigitFields(ids);
        if (digitErr) {
            showToast(digitErr, 'warning');
            return;
        }

        var btn = $(unit ? 'btnSubmitProfilDinas' : 'btnSubmitProfil');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span><span> Menyimpan...</span>';
        var formData = collectProfileForm(prefix, unit ? DINAS_KEYS : SCHOOL_KEYS);
        var restore = function () {
            btn.disabled = false;
            btn.innerHTML = '<span>Simpan Perubahan</span>';
        };

        var fnName = unit ? 'simpanProfilUnitDinas' : 'simpanProfilSekolah';
        callGasServer_(fnName, [formData, String(sessionData.sessionToken)], function (res) {
            restore();
            if (res.status === 'success') {
                setSessionProfil(res.profil);
                showProfile(false);
                showSimpleModal('Profil Berhasil Disimpan!', 'Data profil telah diperbarui dan otomatis terhubung ke Formulir Rekap Pajak.');
            } else {
                showToast('Gagal menyimpan profil: ' + res.message, 'error');
            }
        }, function (err) {
            restore();
            showToast('Terjadi kesalahan: ' + err.message, 'error');
        });
    }

    function handleLogin(e) {
        if (e && e.preventDefault) e.preventDefault();
        var user = String($('loginUser').value || '').trim();
        var pass = String($('loginPass').value || '').trim();
        var btn = $('btnLogin');
        var errBox = $('loginError');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span><span>Memverifikasi...</span>';
        errBox.classList.add('hidden');

        callGasServer_('loginOperator', [user, pass], function (res) {
            btn.disabled = false;
            btn.innerHTML = '<span>Masuk ke Sistem</span>';
            if (!res || res.status !== 'success') {
                errBox.textContent = (res && res.message) ? res.message : 'Gagal memverifikasi akun.';
                errBox.classList.remove('hidden');
                return;
            }

            clearAllUserState();
            sessionData = res;
            $('loginView').classList.add('hidden');
            $('appView').classList.remove('hidden');
            populateMasterDropdowns(res.master);
            $('btnTopPassword').classList.remove('hidden');

            if (res.role === 'ADMIN') {
                $('topbarSchoolName').textContent = 'Admin: ' + res.admin.nama;
                $('operatorNav').classList.add('hidden');
                $('operatorWorkspace').classList.add('hidden');
                $('adminDashboard').classList.remove('hidden');
                if (typeof populateAdminFilters === 'function') populateAdminFilters(res.master);
                if (typeof switchAdminTab === 'function') switchAdminTab('overview');
                if (typeof loadAdminOverview === 'function') loadAdminOverview();
                return;
            }

            applyRoleLabels();
            $('operatorNav').classList.remove('hidden');
            $('adminDashboard').classList.add('hidden');
            $('operatorWorkspace').classList.remove('hidden');
            $('topbarSchoolName').textContent = res.operator.namaOperator + ' (' + (isUnit() ? 'Kode: ' : 'NPSN: ') + res.operator.npsn + ')';

            if (res.initialHistory) {
                historyCache['1__'] = res.initialHistory;
                if (typeof renderRiwayatTable === 'function') renderRiwayatTable(res.initialHistory);
            } else {
                setTimeout(function () {
                    if (typeof loadRiwayatServer === 'function') loadRiwayatServer(1, false);
                }, 80);
            }

            if (!res.operator.hasProfil) {
                var pf = res.operator.prefill || {};
                $('p_npsn').value = res.operator.npsn || '';
                $('p_namaSekolah').value = pf.namaSekolah || res.operator.namaOperator || '';
                $('p_subUnitCoretax').value = pf.subUnitCoretax || '';
                $('p_kabKota').value = isUnit() ? (pf.wilayahBinaan || '') : (pf.kabKota || '');
                $('p_cabangDinas').value = pf.cabangDinas || '';

                switchTab('formProfil');
                var roleLabel = isUnit() ? 'Profil Unit Kerja' : 'Profil Satuan Pendidikan';
                showSimpleModal('Lengkapi Profil Terlebih Dahulu', 'Selamat datang! Silakan periksa dan simpan ' + roleLabel + ' Anda terlebih dahulu sebelum membuka menu Input Pajak.');
            } else {
                setSessionProfil(res.operator.profil);
                switchTab('formPajak');
            }
        }, function (err) {
            btn.disabled = false;
            btn.innerHTML = '<span>Masuk ke Sistem</span>';
            errBox.textContent = err && err.message ? err.message : String(err);
            errBox.classList.remove('hidden');
        });
    }

    function handleLogout() {
        if (sessionData && sessionData.sessionToken) {
            callGasServer_('logoutSession', [String(sessionData.sessionToken)], function () { }, function () { });
        }
        sessionData = null;
        if (typeof cancelEditMode === 'function') cancelEditMode();

        generatedAccountCredentials = [];
        $('generatedCredentials').classList.add('hidden');
        $('generatedCredentialsBody').textContent = '';
        $('operatorNav').classList.remove('hidden');
        $('operatorWorkspace').classList.remove('hidden');

        $('appView').classList.add('hidden');

    function openPasswordModal() {
        $('pw_old').value = '';
        $('pw_new').value = '';
        $('pw_confirm').value = '';
        $('pwError').classList.add('hidden');
        $('modalPassword').classList.remove('hidden');
    }

    function closePasswordModal() {
        $('modalPassword').classList.add('hidden');
    }

    function submitPasswordChange(e) {
        if (e && e.preventDefault) e.preventDefault();
        var err = $('pwError');
        var oldP = String($('pw_old').value || '');
        var newP = String($('pw_new').value || '');
        var conf = String($('pw_confirm').value || '');
        err.classList.add('hidden');
        if (newP.length < 8) {
            err.textContent = 'Password baru minimal 8 karakter.';
            err.classList.remove('hidden');
            return;
        }
        if (newP !== conf) {
            err.textContent = 'Konfirmasi password tidak sama.';
            err.classList.remove('hidden');
            return;
        }
        var btn = $('btnSubmitPassword');
        btn.disabled = true;
        callGasServer_('changeOwnPassword', [String(sessionData.sessionToken), oldP, newP], function (res) {
            btn.disabled = false;
            if (res.status !== 'success') {
                err.textContent = res.message;
                err.classList.remove('hidden');
                return;
            }
            sessionData.sessionToken = res.sessionToken;
            closePasswordModal();
            showSimpleModal('Password Berhasil Diubah', 'Gunakan password baru pada login berikutnya.');
        }, function (ex) {
            btn.disabled = false;
            err.textContent = 'Terjadi kesalahan: ' + ex.message;
            err.classList.remove('hidden');
        });
    }

    function switchTab(tabName) {
        if (tabName !== 'formProfil' && tabName !== 'cabdisMonitoring' && sessionData && isFieldRole() && !isCabdisAccount() && !sessionData.operator.hasProfil) {
            showSimpleModal('Profil Belum Disimpan', 'Silakan lengkapi dan klik Simpan Perubahan pada halaman Profil Satuan Pendidikan terlebih dahulu sebelum menginput pajak.');
            tabName = 'formProfil';
        }
        if (tabName === 'cabdisMonitoring' && !isCabdisAccount()) {
            tabName = 'formPajak';
        }

        var tabs = {
            formPajak: ['tabFormPajak', 'navTabPajak'],
            riwayatPajak: ['tabRiwayatPajak', 'navTabRiwayat'],
            formProfil: ['tabFormProfil', 'navTabProfil'],
            cabdisMonitoring: ['tabCabdisMonitoring', 'navTabCabdisMonitoring']
        };
        var activeClass = 'px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-emerald-600 text-white shadow-sm whitespace-nowrap flex items-center space-x-1.5';
        var inactiveClass = 'px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-emerald-100 hover:text-white whitespace-nowrap flex items-center space-x-1.5';

        Object.keys(tabs).forEach(function (k) {
            if ($(tabs[k][0])) $(tabs[k][0]).classList.toggle('hidden', k !== tabName);
            if ($(tabs[k][1])) $(tabs[k][1]).className = k === tabName ? activeClass : inactiveClass;
        });

        if (tabName === 'formPajak' && typeof checkFormDraft === 'function') checkFormDraft();
        if (tabName === 'riwayatPajak' && typeof loadRiwayatServer === 'function') loadRiwayatServer(currentRiwayatPage, false);
        if (tabName === 'formProfil' && sessionData) showProfile(!sessionData.operator.profil);
        if (tabName === 'cabdisMonitoring' && typeof loadCabdisSchoolMonitoring === 'function') loadCabdisSchoolMonitoring(false);
    }

    function populateMasterDropdowns(master) {
        master = master || {};
        fillDropdown('p_jenisPengadaan', master.pengadaan, '-- Pilih Jenis Pengadaan --');
        fillDropdown('p_bppJenisPajak', master.bppPajak, '-- Pilih Jenis Pajak BPP --');
        fillDropdown('p_sumberDana', master.sumberDana, '-- Pilih Sumber Dana --');

        allObjekPajak = master.objekPajakList || [];
        defaultRincianPajak = master.rincianPajak || [];
        if (typeof renderObjekPajakDatalist === 'function') renderObjekPajakDatalist('');

        buildProfileForms();
        fillDropdown('pf_kabKota', master.kabKota, '-- Pilih Kabupaten/Kota --');
        fillDropdown('pf_cabangDinas', master.cabdin, '-- Pilih Cabang Dinas --');

        var wilList = $('datalistWilayahBinaan');

        (master.wilayahBinaanList || []).forEach(function (w) {

        var dList = $('datalistSekolah');
        dList.innerHTML = '';
        schoolMap = {};
        (master.sekolahList || []).forEach(function (s) {
            var sNama = String(s.nama || s.namaSekolah || '').trim();
            if (!sNama) return;
            var sUpper = sNama.toUpperCase();
            if (sUpper.indexOf('PROVINSI SUMATERA UTARA') !== -1 ||
                sUpper.indexOf('PEMERINTAH PROVINSI') !== -1 ||
                sUpper.indexOf('DINAS PENDIDIKAN') !== -1 ||
                sUpper.indexOf('TAHUN 202') !== -1 ||
                sUpper.indexOf('CABANG WILAYAH') !== -1) {
                return;
            }
            schoolMap[sNama.toUpperCase()] = s;
            var opt = document.createElement('option');
            opt.value = sNama;
            opt.label = (s.npsn ? s.npsn + ' - ' : '') + (s.kabKota ? s.kabKota : '');
            dList.appendChild(opt);
        });

        var rekList = $('datalistRekanan');
        if (rekList) {
            rekList.innerHTML = '';
            (master.rekananList || master.rekanan || []).forEach(function (rk) {
                var o = document.createElement('option');
                o.value = rk.nama;
                o.label = (rk.npwp ? 'NPWP: ' + rk.npwp : '') + (rk.alamat ? ' • ' + rk.alamat : '');
                rekList.appendChild(o);
            });
        }
        rekananMap = master.rekananMap || {};
    }

    function handleRekananAutoFill(val) {
        if (!val) return;
        var key = String(val).trim().toUpperCase();
        var match = rekananMap && rekananMap[key];
        if (match) {
            if (match.alamat && $('p_alamatPerusahaan')) $('p_alamatPerusahaan').value = match.alamat;
            if (match.npwp && $('p_npwpPerusahaan')) {
                $('p_npwpPerusahaan').value = match.npwp;
                updateDigitBadge('p_npwpPerusahaan');
            }
        }
    }
</script>
